{% extends "base.html" %}

{% block title %}Login - BIG-QA AI Portal{% endblock %}

{% block login_content %}
<div class="login-container">
    <div class="login-card glassmorphism">
        <div class="login-header">
            <i class="fas fa-robot login-logo"></i>
            <h1>BIG-QA AI Hub</h1>
            <p>Sign in to access your dashboard</p>
        </div>
        
        <form method="POST" action="{{ url_for('login') }}" class="login-form">
            <div class="form-group">
                <label for="email"><i class="fas fa-envelope"></i> Email Address</label>
                <input type="email" id="email" name="email" required placeholder="name@company.com">
            </div>
            
            <div class="form-group">
                <label for="password"><i class="fas fa-lock"></i> Password</label>
                <input type="password" id="password" name="password" required placeholder="••••••••">
            </div>
            
            <div class="form-actions">
                <button type="submit" class="btn btn-primary btn-block">
                    <span>Login</span> <i class="fas fa-arrow-right"></i>
                </button>
            </div>
        </form>
        
        <div class="login-footer">
            <a href="#" onclick="alert('Please contact your Admin user to retrieve your password.')" class="forgot-link">Forgot Password?</a>
        </div>
    </div>
</div>
{% endblock %}
