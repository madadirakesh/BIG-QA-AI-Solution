<!doctype html>
<html><head><title>Demo Login</title></head>
<body>
<h1>Sign in</h1>
<form onsubmit="event.preventDefault(); const ok = document.getElementById('username').value === 'alice' && document.getElementById('password').value === 's3cret!'; document.getElementById('msg').textContent = ok ? 'Welcome back, alice' : 'Invalid credentials'; if (ok) history.pushState({}, '', '/dashboard');">
  <label for="username">Username</label><input id="username" name="username">
  <label for="password">Password</label><input id="password" name="password" type="password">
  <label for="role">Role</label><select id="role"><option>User</option><option>Admin</option></select>
  <label><input type="checkbox" id="remember"> Remember me</label>
  <button type="submit">Login</button>
</form>
<p id="msg"></p>
</body></html>
