# JUnit Platform configuration. Cucumber reads these as runtime options.
# - cucumber.glue        : packages scanned for @Before/@After/@Given/@When/@Then.
# - cucumber.features    : directory containing the .feature files.
# - cucumber.plugin      : reporters. html: writes a browseable report; json: feeds downstream tooling.
# - cucumber.publish.*   : disables the "Share your Cucumber Report" banner on stdout.
cucumber.publish.quiet=true
cucumber.plugin=pretty, html:Results/cucumber.html, json:Results/cucumber.json
cucumber.glue=stepDefinitions,hooks
cucumber.features=src/test/resources/features
